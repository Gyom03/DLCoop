; coop6.dll settings (read at game startup)
[coop6]
; Lobby slots, including the zombie player (original game: 5 = 4 humans + 1 zombie). 7 = 6 humans + 1 zombie.
Places=7
; 1 = human enemy difficulty extended to 5 and 6 players (otherwise it drops back to solo values)
Difficulte=1
; 1 = colors for players with no index (6th and 7th) instead of white
Couleurs=1
; 1 = extra blocks in the HUD teammate list (copies of G_Player3)
Hud=1
