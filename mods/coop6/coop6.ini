; Réglages de coop6.dll (lus au démarrage du jeu)
[coop6]
; Places du lobby, joueur zombie compris (jeu d'origine : 5 = 4 humains + 1 zombie). 7 = 6 humains + 1 zombie.
Places=7
; 1 = difficulté des ennemis humains prolongée à 5 et 6 joueurs (sinon elle retombe aux valeurs solo)
Difficulte=1
; 1 = couleurs pour les joueurs sans index (6e et 7e) au lieu du blanc
Couleurs=1
; 1 = blocs supplémentaires dans la liste des coéquipiers du HUD (copies de G_Player3)
Hud=1
