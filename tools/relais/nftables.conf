#!/usr/sbin/nft -f
# Firewall for the DLCoop relay VPS: all inbound closed except SSH (TCP 22) and the relay (UDP 20300).
# Installed in /etc/nftables.conf (nftables service) by tools/relais/deployer.sh.
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;
        iif "lo" accept
        ct state established,related accept
        ct state invalid drop
        meta l4proto { icmp, ipv6-icmp } accept   # ping, IPv6 neighbor discovery, MTU
        udp dport 68 accept                        # host DHCP leases
        tcp dport 22 accept                        # SSH (key only, see 00-dlcoop.conf)
        udp dport 20300 accept                     # DLCoop relay
    }
    chain forward {
        type filter hook forward priority filter; policy drop;
    }
    chain output {
        type filter hook output priority filter; policy accept;
    }
}
