#!/usr/sbin/nft -f
# Pare-feu du VPS du relais DLCoop : tout est fermé en entrée sauf SSH (TCP 22) et le relais (UDP 20300).
# Installé dans /etc/nftables.conf (service nftables) par tools/relais/deployer.sh.
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;
        iif "lo" accept
        ct state established,related accept
        ct state invalid drop
        meta l4proto { icmp, ipv6-icmp } accept   # ping, découverte de voisins IPv6, MTU
        udp dport 68 accept                        # baux DHCP de l'hébergeur
        tcp dport 22 accept                        # SSH (clé seulement, cf. 00-dlcoop.conf)
        udp dport 20300 accept                     # relais DLCoop
    }
    chain forward {
        type filter hook forward priority filter; policy drop;
    }
    chain output {
        type filter hook output priority filter; policy accept;
    }
}
